<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Found Item | CampusFind</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <a class="brand" href="index.html" aria-label="CampusFind home">
            <span class="brand-mark" aria-hidden="true">CF</span>
            <span>CampusFind</span>
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="lost.html">Report Lost</a>
            <a href="found.html" aria-current="page">Report Found</a>
            <a href="index.html#search">Search</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section class="form-section page-form found-form">
            <div class="section-heading">
                <span class="section-kicker">Kind campus find</span>
                <h2>Report Found Item</h2>
                <p>Tell the owner where their missing treasure is waiting.</p>
            </div>

                        <form id="foundReportForm" class="report-form" onsubmit="submitFound(event)">
                            <div class="form-grid">
                <label>
                    Item name
                    <input type="text" id="foundName" placeholder="e.g. Black wireless earbuds" required>
                </label>

                <label>
                    Found location
                    <input type="text" id="foundLocation" placeholder="e.g. Student lounge" required>
                </label>

                <label>
                    Date found
                    <input type="date" id="foundDate">
                </label>

                <label class="field-full">
                    Description
                    <textarea id="foundDescription" placeholder="Add color, brand, or other helpful details"></textarea>
                </label>

                <label class="field-full upload-field">
                    Item photo <span>(optional)</span>
                    <input type="file" id="foundImage" accept="image/*">
                    <small>One clear photo helps others recognize your item. Maximum 5 MB.</small>
                </label>
                            </div>

                            <button type="submit">Submit found report</button>
                            <p class="form-note">Please avoid posting private details such as your student ID.</p>
                            <div class="form-status" id="foundStatus" role="status" aria-live="polite"></div>
                        </form>
            <a class="text-link" href="index.html">Back to CampusFind</a>
        </section>
    </main>

    <footer>
        <p>CampusFind | Campus Life &amp; Student Experience</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
