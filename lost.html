<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Lost Item | CampusFind</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <a class="brand" href="index.html" aria-label="CampusFind home">
            <span class="brand-mark" aria-hidden="true">CF</span>
            <span>CampusFind</span>
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="lost.html" aria-current="page">Report Lost</a>
            <a href="found.html">Report Found</a>
            <a href="index.html#search">Search</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section class="form-section page-form">
            <div class="section-heading">
                <span class="section-kicker">Lost &amp; looking</span>
                <h2>Report Lost Item</h2>
                <p>Give your item a few details so it can find its way home.</p>
            </div>

                        <form id="lostReportForm" class="report-form" onsubmit="submitLost(event)">
                            <div class="form-grid">
                <label>
                    Item name
                    <input type="text" id="lostName" placeholder="e.g. Blue water bottle" required>
                </label>

                <label>
                    Last seen location
                    <input type="text" id="lostLocation" placeholder="e.g. Library, 2nd floor" required>
                </label>

                <label>
                    Date lost
                    <input type="date" id="lostDate">
                </label>

                <label class="field-full">
                    Description
                    <textarea id="lostDescription" placeholder="Add color, stickers, or other helpful details"></textarea>
                </label>

                <label class="field-full upload-field">
                    Item photo <span>(optional)</span>
                    <input type="file" id="lostImage" accept="image/*">
                    <small>One clear photo helps others recognize your item. Maximum 5 MB.</small>
                </label>
                            </div>

                            <button type="submit">Submit lost report</button>
                            <p class="form-note">Please avoid posting private details such as your student ID.</p>
                            <div class="form-status" id="lostStatus" role="status" aria-live="polite"></div>
                        </form>
            <a class="text-link" href="index.html">Back to CampusFind</a>
        </section>
    </main>

    <footer>
        <p>CampusFind | Campus Life &amp; Student Experience</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
